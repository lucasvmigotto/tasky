# TLS-terminating proxy in front of mock-oauth2-server (development only).
# Real IdPs (Entra ID included) only talk HTTPS — this makes the local mock
# behave like one. Plain HTTP still available directly on mock-oauth2:8080.
server {
    listen       443 ssl;
    server_name  localhost;

    ssl_certificate     /certs/mock-oidc.pem;
    ssl_certificate_key /certs/mock-oidc-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://mock-oauth2:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }
}
