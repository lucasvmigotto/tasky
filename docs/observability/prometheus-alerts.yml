# TaskY alert rules (Phase 6). Wire into the production Prometheus;
# each alert links the runbook in docs/runbooks/oncall.md (Phase 10).
groups:
  - name: tasky-api
    rules:
      - alert: TaskYHigh5xx
        expr: sum(rate(http_server_requests_seconds_count{application="tasky", status=~"5.."}[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "TaskY 5xx spike"

      - alert: TaskYRefreshReuseBurst
        expr: sum(rate(tasky_refresh_reused_total[5m])) > 0.05
        for: 10m
        labels:
          severity: high
        annotations:
          summary: "Refresh token reuse burst (possible theft)"

      - alert: TaskYHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{application="tasky"}[5m]))) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "TaskY p95 above 800ms"
