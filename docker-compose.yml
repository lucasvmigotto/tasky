# TaskY — single development-only Compose stack.
# Production uses a separate approach (out of scope for this file).
# Services: api (Spring Boot) + app (Nginx SPA) + db (PostgreSQL 18)
#           + redis (cache) + minio (S3-compatible storage)
#           + mock-oauth2 (local Google/Microsoft OIDC stand-in, see mock-oauth2-server/config.json).
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: tasky-api
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tasky}
      POSTGRES_USER: ${POSTGRES_USER:-tasky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasky}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      MOCK_OAUTH2_ENABLED: ${MOCK_OAUTH2_ENABLED:-true}
      MOCK_OAUTH2_GOOGLE_ISSUER: ${MOCK_OAUTH2_GOOGLE_ISSUER:-http://localhost:48080/tasky-google-mock}
      MOCK_OAUTH2_MICROSOFT_ISSUER: ${MOCK_OAUTH2_MICROSOFT_ISSUER:-http://localhost:48080/tasky-microsoft-mock}
      MOCK_OAUTH2_GOOGLE_JWKS_URI: ${MOCK_OAUTH2_GOOGLE_JWKS_URI:-http://mock-oauth2:8080/tasky-google-mock/jwks}
      MOCK_OAUTH2_MICROSOFT_JWKS_URI: ${MOCK_OAUTH2_MICROSOFT_JWKS_URI:-http://mock-oauth2:8080/tasky-microsoft-mock/jwks}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TASKY_STORAGE_BUCKET: ${TASKY_STORAGE_BUCKET:-tasky-dev}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    volumes:
      - tasky-uploads:/app/data
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mock-oauth2:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    restart: unless-stopped

  app:
    build: app/
    container_name: tasky-app
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-5173}:8080"
    environment:
      NGINX_ENVSUBST_FILTER: API_UPSTREAM
      API_UPSTREAM: http://api:8080
      DEMO_MODE: ${DEMO_MODE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MOCK_OAUTH2_ENABLED: ${MOCK_OAUTH2_ENABLED:-true}
      MOCK_OAUTH2_URL: ${MOCK_OAUTH2_URL:-http://localhost:48080}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  wal-init:
    image: postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
    container_name: tasky-wal-init
    user: root
    command: ["sh", "-c", "chown postgres:postgres /wal && chmod 700 /wal"]
    volumes:
      - pgwal:/wal
    restart: "no"

  db:
    image: postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
    depends_on:
      wal-init:
        condition: service_completed_successfully
    command:
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal/%f && cp %p /wal/%f
    container_name: tasky-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tasky}
      POSTGRES_USER: ${POSTGRES_USER:-tasky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasky}
    volumes:
      # PG18 convention: mount the parent dir so major-version subdirs
      # can coexist (pg_upgrade path for future PG19).
      - pgdata:/var/lib/postgresql
      - pgwal:/wal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine@sha256:bd999b5cfee25fb24b8320a31fddbd69f462df44c8138c66e369582937beebc0
    container_name: tasky-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: tasky-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mock-oauth2:
    image: ghcr.io/navikt/mock-oauth2-server@sha256:b538810afd589d42fbfb856c588c2065eaeed1dc528d6c532972048e67fc2aff
    container_name: tasky-mock-oauth2
    ports:
      - "${MOCK_OAUTH2_BIND_ADDRESS:-127.0.0.1}:${MOCK_OAUTH2_PORT:-48080}:8080"
    volumes:
      - ./mock-oauth2-server/config.json:/app/config.json:ro
    environment:
      HOSTNAME: localhost
    restart: unless-stopped

volumes:
  pgdata:
  pgwal:
  redisdata:
  miniodata:
  tasky-uploads:
