name: API CI

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew :api:test

      - name: Extract version
        id: version
        run: |
          VERSION="$(awk -F"'" '/^version = / { print $2; exit }' api/build.gradle)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          TAG: api-${{ steps.version.outputs.version }}
        run: |
          REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          if [ -z "$REMOTE_SHA" ]; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          elif [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "Tag $TAG already points to $REMOTE_SHA, not $GITHUB_SHA" >&2
            exit 1
          else
            echo "Tag $TAG already points to this commit"
          fi

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION="$(awk -F"'" '/^version = / { print $2; exit }' api/build.gradle)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub Container registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/tasky-api
            ghcr.io/${{ github.repository }}-api

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: "."
          file: api/Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/tasky-api:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}-api:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/tasky-api:latest
            ghcr.io/${{ github.repository }}-api:latest

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository }}-api
          subject-digest: ${{ steps.push.outputs.digest }}

  release-artifact:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION="$(awk -F"'" '/^version = / { print $2; exit }' api/build.gradle)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ steps.version.outputs.version }}
          git archive --format=zip -o "source-${V}.zip" HEAD api/ build.gradle settings.gradle
          if gh release view "api-$V" >/dev/null 2>&1; then
            gh release upload "api-$V" "source-${V}.zip" --clobber
          else
            gh release create "api-$V" --title "api-v$V" --notes "Release api-v$V" "source-${V}.zip"
          fi
