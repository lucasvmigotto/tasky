name: Docs CI

on:
  push:
    branches: [main, dev]
    paths:
      - "docs/site/**"
      - "docs/product/**"
      - "specs/**"
      - "contracts/openapi.yaml"
      - ".github/workflows/docs-ci.yml"
  pull_request:
    paths:
      - "docs/site/**"
      - "docs/product/**"
      - "specs/**"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: docs/site

      - name: Lint (Biome)
        run: bun run lint
        working-directory: docs/site

      - name: Typecheck
        run: bun run typecheck
        working-directory: docs/site

      - name: Unit and a11y tests
        run: bun run test
        working-directory: docs/site

      - name: Build (emits dist + llms output)
        run: bun run build
        working-directory: docs/site

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps
        working-directory: docs/site

      - name: e2e smoke (serves the production build)
        run: E2E_NO_SERVER=1 bunx playwright test
        working-directory: docs/site
        env:
          E2E_NO_SERVER: "1"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-dist
          path: docs/site/dist
          retention-days: 7

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: docs
    env:
      AWS_ACCESS_KEY_ID: ${{ vars.CLOUDFLARE_R2_ACCOUNT_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_SECRET }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT_S3_CLIENT }}
      R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Install and build
        run: bun install --frozen-lockfile && bun run build
        working-directory: docs/site

      - name: Check R2 credentials
        id: creds
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::R2 credentials not configured — skipping deploy"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate R2 endpoint
        if: steps.creds.outputs.present == 'true'
        run: |
          if [ -z "$R2_ENDPOINT" ]; then echo "::error::CLOUDFLARE_R2_ENDPOINT_S3_CLIENT repo variable is not set"; exit 1; fi
          case "$R2_ENDPOINT" in https://*) ;; *) echo "::error::CLOUDFLARE_R2_ENDPOINT_S3_CLIENT must start with https:// (got: $R2_ENDPOINT)"; exit 1;; esac
          if [ -z "$R2_BUCKET" ]; then echo "::error::CLOUDFLARE_R2_BUCKET_ID repo variable is not set"; exit 1; fi

      - name: Sync hashed assets (immutable)
        if: steps.creds.outputs.present == 'true'
        run: |
          aws s3 sync docs/site/dist/assets "s3://$R2_BUCKET/assets" \
            --endpoint-url "$R2_ENDPOINT" --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync screenshots (long-lived)
        if: steps.creds.outputs.present == 'true'
        run: |
          aws s3 sync docs/site/dist/screenshots "s3://$R2_BUCKET/screenshots" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=604800"

      - name: Sync Markdown (LLM output, no-cache, text/markdown)
        if: steps.creds.outputs.present == 'true'
        run: |
          aws s3 sync docs/site/dist/docs "s3://$R2_BUCKET/docs" \
            --endpoint-url "$R2_ENDPOINT" --delete \
            --content-type "text/markdown; charset=utf-8" \
            --cache-control "no-cache"

      - name: Sync entry files and llms (no-cache)
        if: steps.creds.outputs.present == 'true'
        run: |
          aws s3 cp docs/site/dist/index.html "s3://$R2_BUCKET/index.html" \
            --endpoint-url "$R2_ENDPOINT" --content-type "text/html; charset=utf-8" --cache-control "no-cache"
          aws s3 cp docs/site/dist/llms.txt "s3://$R2_BUCKET/llms.txt" \
            --endpoint-url "$R2_ENDPOINT" --content-type "text/plain; charset=utf-8" --cache-control "no-cache"
          aws s3 cp docs/site/dist/llms-full.txt "s3://$R2_BUCKET/llms-full.txt" \
            --endpoint-url "$R2_ENDPOINT" --content-type "text/plain; charset=utf-8" --cache-control "no-cache"
          aws s3 cp docs/site/dist/favicon.svg "s3://$R2_BUCKET/favicon.svg" \
            --endpoint-url "$R2_ENDPOINT" --content-type "image/svg+xml" --cache-control "public, max-age=86400"
          aws s3 cp docs/site/dist/og-image.png "s3://$R2_BUCKET/og-image.png" \
            --endpoint-url "$R2_ENDPOINT" --content-type "image/png" --cache-control "public, max-age=86400"
