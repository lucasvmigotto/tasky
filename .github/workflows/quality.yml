name: quality

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read
  security-events: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: ./gradlew :api:test :api:build --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1'
      - run: bun install --frozen-lock-file
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build Java for CodeQL
        if: matrix.language == 'java-kotlin'
        run: ./gradlew :api:classes --no-daemon
      - uses: github/codeql-action/analyze@v3

  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot dev stack (db + api)
        run: |
          sed 's/^JWT_SECRET=.*/JWT_SECRET=dGVzdC1zZWNyZXQta2V5LXRoYXQtaXMtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZy1mb3ItaHMyNTYtYWxnb3JpdGhtCg==/' .env.example > /tmp/ci.env
          docker compose --env-file /tmp/ci.env up -d --build api
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/actuator/health && break
            sleep 10
          done
      - name: Check OpenAPI contract
        run: ./scripts/check-openapi-contract.sh
        env:
          API_BASE_URL: http://127.0.0.1:8080
      - name: Teardown
        if: always()
        run: docker compose --env-file /tmp/ci.env down -v

  container-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: api/Dockerfile
            image: tasky-api:scan
          - name: app
            context: app
            file: app/Dockerfile
            image: tasky-app:scan
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          push: false
          tags: ${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      # Pinned to v0.36.0 (immutable commit): the pre-incident `0.28.0` tag was
      # removed and all tags now carry the `v` prefix.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ matrix.image }}
          format: spdx-json
          artifact-name: tasky-${{ matrix.name }}.spdx.json
          output-file: ./tasky-${{ matrix.name }}.spdx.json
