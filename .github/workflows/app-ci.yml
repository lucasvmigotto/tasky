name: App CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1'

      - name: Install dependencies
        run: bun install --frozen-lock-file
        working-directory: app/

      - name: Run lint
        run: bun run lint
        working-directory: app/

      - name: Run tests
        run: bun run test
        working-directory: app/

      - name: Extract version
        id: version
        run: |
          VERSION="$(jq -r '.version' app/package.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          TAG: app-${{ steps.version.outputs.version }}
        run: |
          REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          if [ -z "$REMOTE_SHA" ]; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          elif [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "Tag $TAG already points to $REMOTE_SHA, not $GITHUB_SHA" >&2
            exit 1
          else
            echo "Tag $TAG already points to this commit"
          fi

  build-and-push:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION="$(jq -r '.version' app/package.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub Container registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/tasky-app
            ghcr.io/${{ github.repository }}-app

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: app/
          file: app/Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/tasky-app:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}-app:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/tasky-app:latest
            ghcr.io/${{ github.repository }}-app:latest

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository }}-app
          subject-digest: ${{ steps.push.outputs.digest }}

  release-artifact:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION="$(jq -r '.version' app/package.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ steps.version.outputs.version }}
          git archive --format=zip -o "source-${V}.zip" HEAD app/
          if gh release view "app-$V" >/dev/null 2>&1; then
            gh release upload "app-$V" "source-${V}.zip" --clobber
          else
            gh release create "app-$V" --title "app-v$V" --notes "Release app-v$V" "source-${V}.zip"
          fi
