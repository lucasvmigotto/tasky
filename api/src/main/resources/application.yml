server:
  port: 8080

spring:
  application:
    name: tasky
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tasky}
    username: ${POSTGRES_USER:tasky}
    password: ${POSTGRES_PASSWORD:tasky}
    driver-class-name: org.postgresql.Driver
  data:
    web:
      pageable:
        default-page-size: 50
        max-page-size: 500
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com
          jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: tasky
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 0.1
  send-default-pii: false

tasky:
  jwt:
    secret: ${JWT_SECRET}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  cache:
    report-summary-ttl: ${TASKY_SUMMARY_CACHE_TTL:PT30S}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  microsoft:
    client-id: ${MICROSOFT_CLIENT_ID:}
    tenant-id: ${MICROSOFT_TENANT_ID:common}
  mock-oauth2:
    enabled: ${MOCK_OAUTH2_ENABLED:false}
    google-issuer: ${MOCK_OAUTH2_GOOGLE_ISSUER:}
    microsoft-issuer: ${MOCK_OAUTH2_MICROSOFT_ISSUER:}
    google-jwks-uri: ${MOCK_OAUTH2_GOOGLE_JWKS_URI:}
    microsoft-jwks-uri: ${MOCK_OAUTH2_MICROSOFT_JWKS_URI:}
  platform:
    super-admin-emails: ${TASKY_SUPER_ADMINS:}
  reminders:
    fixed-delay-ms: ${REMINDER_FIXED_DELAY_MS:60000}
    due-soon-window: ${REMINDER_DUE_SOON_WINDOW:24h}
    open-timer-age: ${REMINDER_OPEN_TIMER_AGE:8h}
    pending-approval-age: ${REMINDER_PENDING_APPROVAL_AGE:24h}
    batch-size: ${REMINDER_BATCH_SIZE:100}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    io.tasky.api: DEBUG
