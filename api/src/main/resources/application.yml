server:
  port: 8080

spring:
  application:
    name: tasky
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tasky}
    username: ${POSTGRES_USER:tasky}
    password: ${POSTGRES_PASSWORD:tasky}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com
          jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

tasky:
  jwt:
    secret: ${JWT_SECRET}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  platform:
    super-admin-emails: ${TASKY_SUPER_ADMINS:}
  reminders:
    fixed-delay-ms: ${REMINDER_FIXED_DELAY_MS:60000}
    due-soon-window: ${REMINDER_DUE_SOON_WINDOW:24h}
    open-timer-age: ${REMINDER_OPEN_TIMER_AGE:8h}
    pending-approval-age: ${REMINDER_PENDING_APPROVAL_AGE:24h}
    batch-size: ${REMINDER_BATCH_SIZE:100}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    io.tasky.api: DEBUG
